<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Canadian Verified Moss Green Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A7C5B" />
      <stop offset="50%" stop-color="#3F6B4F" />
      <stop offset="100%" stop-color="#2D4E39" />
    </linearGradient>
    <!-- Vivid Luminous Gold Gradient -->
    <linearGradient id="monogramGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- High-Contrast Shield Base Plate in Canadian Verified Green -->
  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#shieldBg)" stroke="#5B8F6D" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- Centered Bold Monogram Emblem (Expanded Scale, No Outer Ring) -->
  <g transform="translate(100, 100) scale(1.05)">
    <!-- Architectural 'A' Silhouette in Pure Clean White (Bold & Clear) -->
    <path d="M-54 75 L0 -75 L54 75" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- 'A' Crossbar in Luminous Tailoring Gold -->
    <path d="M-36 22 L36 22" stroke="#FBBF24" stroke-width="9" stroke-linecap="round" fill="none" />

    <!-- Fluid Sartorial 'S' Silk Thread in Shimmering Gold (Bold & Prominent) -->
    <path d="M30 -40 C18 -70 -30 -68 -32 -35 C-35 -5 35 5 32 40 C30 68 -15 72 -35 55" stroke="url(#monogramGold)" stroke-width="12" stroke-linecap="round" fill="none" />

    <!-- Apex Needle Eye Gold Bead -->
    <circle cx="0" cy="-75" r="5.5" fill="#FEF08A" stroke="#24402F" stroke-width="2" />

    <!-- Center Tailoring Pin Intersection -->
    <circle cx="0" cy="22" r="4.5" fill="#FFFFFF" stroke="#24402F" stroke-width="2" />
  </g>
</svg>
