<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap');
      .title { font-family: 'Newsreader', serif; font-size: 38px; font-weight: 600; fill: #0F172A; letter-spacing: 0.08em; }
      .tagline { font-family: 'Instrument Sans', sans-serif; font-size: 13px; font-weight: 600; fill: #854D0E; letter-spacing: 0.28em; text-transform: uppercase; }
      .concept-tag { font-family: 'Instrument Sans', sans-serif; font-size: 11px; font-weight: 700; fill: #0F172A; letter-spacing: 0.15em; text-transform: uppercase; }
    </style>
    <linearGradient id="luxuryGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308" />
      <stop offset="50%" stop-color="#C4704B" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="deepNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="subtleShadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Artboard: Warm Canvas Linen -->
  <rect width="800" height="600" fill="#FDFBF7" />
  
  <!-- Subtle Framing Container -->
  <rect x="40" y="40" width="720" height="520" rx="16" fill="#FFFFFF" stroke="#E2DDD5" stroke-width="1.5" filter="url(#subtleShadow3)" />

  <!-- Concept Badge Top Left -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="185" height="26" rx="13" fill="#F1F5F9" stroke="#0F172A" stroke-width="1" stroke-opacity="0.2"/>
    <text x="92.5" y="17" text-anchor="middle" class="concept-tag">CONCEPT 03 • THE WEAVE</text>
  </g>

  <!-- EMBLEM: THE BESPOKE HANGER & INFINITY CAPSULE WEAVE -->
  <g transform="translate(400, 235)">
    <!-- Outer Arching Coat Hanger Hook (Gold Accent) -->
    <path d="M0 -38 C-12 -65 14 -82 14 -94 C14 -104 2 -110 -8 -105 C-18 -100 -20 -88 -20 -88" 
          fill="none" 
          stroke="url(#luxuryGold)" 
          stroke-width="4" 
          stroke-linecap="round"/>

    <!-- Subtle Golden Finial Bead -->
    <circle cx="-20" cy="-88" r="3" fill="#C4704B"/>

    <!-- The Wooden Bespoke Hanger Shoulders Curve -->
    <path d="M-88 12 C-55 -18 -20 -38 0 -38 C20 -38 55 -18 88 12" 
          fill="none" 
          stroke="url(#deepNavy)" 
          stroke-width="6" 
          stroke-linecap="round"/>

    <!-- Dual Interlocking Capsule Loops (Warp & Weft Textile Symmetry) -->
    <!-- Left Loop (Occasion Focus) -->
    <ellipse cx="-28" cy="24" rx="42" ry="26" 
             transform="rotate(-25 -28 24)" 
             fill="none" 
             stroke="#C4704B" 
             stroke-width="3.5" 
             stroke-dasharray="8 4"/>

    <!-- Right Loop (Capsule Versatility) -->
    <ellipse cx="28" cy="24" rx="42" ry="26" 
             transform="rotate(25 28 24)" 
             fill="none" 
             stroke="url(#deepNavy)" 
             stroke-width="4.5"/>

    <!-- Central Tailoring Eyelet / Intersection Node -->
    <circle cx="0" cy="24" r="8" fill="#FFFFFF" stroke="#3F6B4F" stroke-width="3"/>
    <circle cx="0" cy="24" r="3" fill="#3F6B4F"/>

    <!-- Horizontal Trouser Bar of Hanger -->
    <line x1="-70" y1="68" x2="70" y2="68" stroke="#E2DDD5" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-70" cy="68" r="3" fill="#C4704B"/>
    <circle cx="70" cy="68" r="3" fill="#C4704B"/>
  </g>

  <!-- LOGOTYPE LOCKUP -->
  <g transform="translate(400, 415)">
    <!-- Primary Brand Wordmark in Newsreader Serif -->
    <text x="0" y="0" text-anchor="middle" class="title">STYLE ADVISOR</text>
    
    <!-- Architectural Divider Line with Center Woven Knot -->
    <line x1="-130" y1="20" x2="-20" y2="20" stroke="#854D0E" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="0" cy="20" r="4" fill="#C4704B"/>
    <circle cx="0" cy="20" r="1.5" fill="#FFFFFF"/>
    <line x1="20" y1="20" x2="130" y2="20" stroke="#854D0E" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Subtitle / Brand Descriptor -->
    <text x="0" y="44" text-anchor="middle" class="tagline">MODULAR WARDROBES • VERIFIED PIECES</text>
  </g>
</svg>
